name: CI Tests
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/lint-provider-tfe

  validate:
    name: docgen validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/validate-provider-tfe

  generate-docs:
    name: docgen generate-docs
    needs: [ validate ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/generate-docs-provider-tfe

  tests:
    name: run
    if: "!startsWith(github.head_ref, 'changelog/')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # If you adjust these parameters, also adjust the jrm input files on the "Merge reports" step below
        total: [ 8 ]
        index: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
    steps:
      - name: Dispatch setup workflow and run tests
        id: dispatch
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          workflow: setup-env-and-dispatch.yml
          repo: hashicorp/setup-tfe-acceptance-env
          ref: christian-doucette/initial-version
          token: ${{ secrets.TF_ACCEPTANCE_ENV_SETUP_PAT }}
          wait-for-completion: true
          wait-timeout-seconds: 7200
          wait-interval-seconds: 30
          sync-status: true
          inputs: '{ "terraform_enterprise": false, "terraform_provider_tfe_sha": "${{ github.sha }}", "matrix_index": "${{ matrix.index }}", "matrix_total": "${{ matrix.total }}", "list_tests": ".", "skip": "TestAccTFESAMLSettings_omnibus|TestAccTFESCIM", "request_id": "terraform-provider-tfe-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.index }}" }'

      - name: Download test artifact from setup workflow
        env:
          GH_TOKEN: ${{ secrets.TF_ACCEPTANCE_ENV_SETUP_PAT }}
        run: |
          gh run download "${{ steps.dispatch.outputs.runId }}" \
            --repo hashicorp/setup-tfe-acceptance-env \
            --name "junit-test-summary-${{ matrix.index }}" \
            --dir "junit-test-summary-${{ matrix.index }}"

      - name: Upload test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-summary-${{ matrix.index }}
          path: junit-test-summary-${{ matrix.index }}/summary.xml
          retention-days: 1
  tests-combine-summaries:
    name: Combine Test Reports
    if: "!startsWith(github.head_ref, 'changelog/')"
    needs: [ tests ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Install junit-report-merger
        run: npm install -g junit-report-merger

      - name: Merge reports
        run: jrm ./ci-summary-provider.xml "junit-test-summary-0/*.xml" "junit-test-summary-1/*.xml" "junit-test-summary-2/*.xml" "junit-test-summary-3/*.xml" "junit-test-summary-4/*.xml" "junit-test-summary-5/*.xml" "junit-test-summary-6/*.xml" "junit-test-summary-7/*.xml" "junit-test-summary-workspace-run/*.xml"

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-test-summary
          path: ./ci-summary-provider.xml

  tests-summarize:
    name: Summarize Tests
    if: "!startsWith(github.head_ref, 'changelog/')  && always()"
    needs: [ tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Check tests Status
        run: |
          if [ "${{ needs.tests.result }}" = "success" ]; then
            exit 0
          fi
          exit 1
