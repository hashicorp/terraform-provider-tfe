name: CI Tests
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/lint-provider-tfe

  dispatch-acceptance-tests:
    name: Dispatch Acceptance Tests
    if: "!startsWith(github.head_ref, 'changelog/')"
    runs-on: ubuntu-latest
    steps:
      - name: Create initial check run
        id: create-check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Acceptance Tests (dispatched)',
              head_sha: context.sha,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              output: {
                title: 'Dispatching to setup-tfe-acceptance-env',
                summary: 'Triggering environment setup and test execution'
              }
            });
            return check.id;

      - name: Dispatch to setup-tfe-acceptance-env
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.TF_ACCEPTANCE_ENV_SETUP_PAT }}
          repository: hashicorp/setup-tfe-acceptance-env
          event-type: setup-tfe-env
          client-payload: |
            {
              "pr_number": "${{ github.event.pull_request.number || '' }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "check_run_id": "${{ steps.create-check.outputs.result }}",
              "repository": "${{ github.repository }}",
              "ci_run_id": "${{ github.run_id }}",
              "ci_run_number": "${{ github.run_number }}",
              "ci_run_attempt": "${{ github.run_attempt }}"
            }

      - name: Update check run (dispatched)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: ${{ steps.create-check.outputs.result }},
              status: 'completed',
              conclusion: 'success',
              completed_at: new Date().toISOString(),
              output: {
                title: 'Dispatched to setup-tfe-acceptance-env',
                summary: 'Environment setup and tests will run in separate workflow. Check "Acceptance Tests" checks for results.'
              }
            });