kind: BREAKING CHANGES
body: '`idp_cert` can no longer be set to an empty string, whitespace or PEM armor without a certificate body; such values now fail at plan time. Omit `idp_cert` instead. On Terraform Enterprise v2.1.0 or later, `terraform destroy` no longer clears `idp_cert`; it only disables SAML and leaves every IdP certificate on the instance. Use `tfe_saml_idp_certificate` to manage certificate removal.'
