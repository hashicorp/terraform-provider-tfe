kind: ENHANCEMENTS
body: '`idp_cert` is now optional and deprecated in favor of the `tfe_saml_idp_certificate` resource. `idp_cert` is still required on Terraform Enterprise releases earlier than v2.1.0, and omitting it there fails at plan time. Removing `idp_cert` from configuration only stops Terraform from managing it. Changing only the formatting of `idp_cert` (line wrapping or PEM armor) is no longer a diff.'
